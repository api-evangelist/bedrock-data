name: Bedrock Data
description: >-
  Bedrock Data (Bedrock Labs, Inc.) is a data security posture management (DSPM)
  company that helps organizations discover, classify, and control sensitive data
  across cloud, SaaS, and on-premises environments. Its platform is built on a
  unified Metadata Lake that combines data sensitivity, lineage, identity and
  access entitlements, and data-flow analysis, layered with AI-driven
  classification and a natural-language policy engine, and a zero-data-access
  architecture in which analysis runs where the data already resides. Bedrock
  advertises a Graph API (GraphQL) and MCP integration surface for downstream
  security tooling such as SIEM, Wiz, Sysdig, and Jira, though no public developer
  documentation or OpenAPI is currently available. The company is backed by
  Greylock.
